name: Build Qt C++ App (macOS)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build and Package macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt using aqtinstall
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install aqtinstall
          # 6.9.2+ no longer links AGL (removed from the macOS 26 SDK).
          aqt install-qt mac desktop 6.9.2 clang_64
          aqt install-qt mac desktop 6.9.2 clang_64 -m qtpdf
          echo "QT_DIR=$(pwd)/6.9.2/macos" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          brew install cmake ninja create-dmg

      - name: Configure CMake project
        run: |
          rm -rf out/build
          mkdir -p out/build
          cmake -S . -B out/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_DIR"

      - name: Build Qt Application
        run: cmake --build out/build --config Release

      - name: Package into DMG
        run: |
          cd out/build
          APP_NAME="Editerako.app"
          if [ ! -d "$APP_NAME" ]; then
            echo "Erreur : $APP_NAME introuvable dans $(pwd)"
            ls -la
            exit 1
          fi
          mkdir -p dmg
          create-dmg \
            --volname "Editerako Installer" \
            --window-size 500 300 \
            --icon-size 100 \
            --app-drop-link 400 150 \
            "dmg/Editerako.dmg" "$APP_NAME"
          echo "DMG_PATH=$(pwd)/dmg/Editerako.dmg" >> $GITHUB_ENV

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Editerako-macos
          path: |
            out/build/Editerako.app
            out/build/dmg/*.dmg
